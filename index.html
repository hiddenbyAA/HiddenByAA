<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hidden by AA</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="container">

            <h1>
                Hidden by AA
            </h1>

            <p>
                Temukan barang yang diam-diam turun harga 🔥
            </p>

        </div>

    </header>



    <!-- MAIN -->

    <main class="container">


        <!-- SEARCH -->

        <section class="search-section">

            <div class="search-box">

                <span class="search-icon">
                    🔎
                </span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Cari nama barang..."
                    autocomplete="off"
                >

            </div>

        </section>



        <!-- FILTER -->

        <section class="filter-section">


            <div class="filter-item">

                <label for="categoryFilter">
                    Kategori
                </label>

                <select id="categoryFilter">

                    <option value="all">
                        Semua kategori
                    </option>

                </select>

            </div>



            <div class="filter-item">

                <label for="timeFilter">
                    Jam Turun
                </label>

                <select id="timeFilter">

                    <option value="all">
                        Semua jam
                    </option>

                </select>

            </div>



            <div class="filter-item">

                <label for="minPrice">
                    Harga Minimum
                </label>

                <input
                    type="number"
                    id="minPrice"
                    placeholder="Rp 0"
                    min="0"
                >

            </div>



            <div class="filter-item">

                <label for="maxPrice">
                    Harga Maksimum
                </label>

                <input
                    type="number"
                    id="maxPrice"
                    placeholder="Rp 10.000.000"
                    min="0"
                >

            </div>



            <button
                id="resetFilter"
                class="reset-button"
            >
                Reset Filter
            </button>

        </section>



        <!-- RESULT INFO -->

        <section class="result-info">

            <span>

                <strong id="productCount">
                    0
                </strong>

                produk ditemukan

            </span>


            <span id="loadingText">
                Memuat produk...
            </span>

        </section>



        <!-- PRODUCT -->

        <section
            id="productContainer"
            class="product-grid"
        >
        </section>



        <!-- EMPTY STATE -->

        <section
            id="emptyState"
            class="empty-state"
        >

            <div class="empty-icon">
                🔍
            </div>

            <h2>
                Produk tidak ditemukan
            </h2>

            <p>
                Coba gunakan kata kunci atau filter yang berbeda.
            </p>

        </section>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 Hidden by AA
        </p>

        <span>
            Hidden deals, better prices.
        </span>

    </footer>



    <script src="script.js"></script>

</body>

</html>
